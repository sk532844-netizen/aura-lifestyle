<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diag4</title></head>
<body><pre id="out">testing...</pre>
<script src="data.js"></script>
<script type="module">
import { fetchProducts, fetchSettings } from './firebase.js';
const out = (t) => { document.getElementById('out').textContent += '\n' + t; };
let SETTINGS = { ...DEFAULT_SETTINGS };
function visibleMains() { const hidden = (SETTINGS.hiddenCategories || []); return MAIN_CATEGORIES.filter((m) => !hidden.includes(m.slug)); }
try {
  out('before: visible=' + visibleMains().length);
  const [remoteProducts, remoteSettings] = await Promise.all([fetchProducts(), fetchSettings()]);
  out('remoteSettings truthy=' + !!remoteSettings);
  if (remoteSettings) { SETTINGS = { ...DEFAULT_SETTINGS, ...remoteSettings }; }
  out('after merge: hiddenCategories=' + JSON.stringify(SETTINGS.hiddenCategories));
  out('after: visible=' + visibleMains().length + ' -> ' + visibleMains().map(m=>m.slug).join(','));
  out('DIAG4 COMPLETE');
} catch (e) {
  out('ERROR: ' + (e && e.message ? e.message : String(e)));
}
</script></body></html>
