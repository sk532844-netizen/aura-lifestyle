<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diag5</title></head>
<body><pre id="out">testing...</pre>
<script src="data.js?v=20261015"></script>
<script type="module">
import { fetchProducts, fetchSettings } from './firebase.js?v=20261015';
const out = (t) => { document.getElementById('out').textContent += '\n' + t; };
let SETTINGS = { ...DEFAULT_SETTINGS };
try {
  out('Promise.all([fetchProducts(), fetchSettings()])...');
  const [remoteProducts, remoteSettings] = await Promise.all([fetchProducts(), fetchSettings()]);
  out('products: ' + (remoteProducts ? remoteProducts.length + ' items' : 'NULL'));
  out('settings: ' + (remoteSettings ? 'OBJECT' : 'NULL'));
  if (remoteSettings) { SETTINGS = { ...DEFAULT_SETTINGS, ...remoteSettings }; }
  const hidden = (SETTINGS.hiddenCategories || []);
  const visible = MAIN_CATEGORIES.filter((m) => !hidden.includes(m.slug));
  out('visible categories: ' + visible.length + ' -> ' + visible.map(m=>m.slug).join(','));
  out('DIAG5 COMPLETE');
} catch (e) {
  out('ERROR: ' + (e && e.message ? e.message : String(e)));
}
</script></body></html>
